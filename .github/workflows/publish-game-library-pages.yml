name: 发布游戏库 Pages

on:
  push:
    branches:
      - master
    paths:
      - "games/**"
      - "scripts/generate_manifest_pages.py"
      - ".github/workflows/publish-game-library-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "game-library-pages"
  cancel-in-progress: true

jobs:
  build:
    name: 生成 manifest
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 生成 Pages 文件
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python scripts/generate_manifest_pages.py \
            --games-dir games \
            --output-dir public \
            --base-url "$PAGES_BASE_URL"

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: 发布 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
